# ── AegisTrace Nginx — /etc/nginx/sites-available/aegistrace.uk ──────────────
# Cloudflare Origin Certificate handles SSL.
# Set Cloudflare SSL/TLS mode to: Full (Strict)
# ─────────────────────────────────────────────────────────────────────────────

# Redirect bare HTTP → HTTPS (Cloudflare always sends HTTPS to the browser,
# but this catches any direct-IP hits).
server {
    listen 80;
    listen [::]:80;
    server_name aegistrace.uk www.aegistrace.uk;

    # Allow Cloudflare health probes on HTTP; redirect everything else.
    location /api/health {
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aegistrace.uk www.aegistrace.uk;

    # ── SSL — Cloudflare Origin Certificate ──────────────────────────────────
    # Generate at: Cloudflare → aegistrace.uk → SSL/TLS → Origin Server
    # → Create Certificate → save the two files below.
    ssl_certificate     /etc/nginx/ssl/aegistrace.uk.pem;
    ssl_certificate_key /etc/nginx/ssl/aegistrace.uk.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers (complement Cloudflare's own) ────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Upload / request size ─────────────────────────────────────────────────
    # pcap uploads, report downloads — keep generous.
    client_max_body_size 100M;
    proxy_read_timeout   300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout   300s;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # ── Proxy to AegisTrace container ─────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support — required by /api/terminal and /api/terminal-lab
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_buffering    off;
    }

    # ── Static asset caching (React build) ────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header       Cache-Control "public, max-age=604800, immutable";
        access_log       off;
    }

    # ── Block direct access to sensitive paths ────────────────────────────────
    location ~ /\.(env|git|DS_Store) {
        deny all;
        return 404;
    }
}
